name: Deploy Unity WebGL Game to Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch uses that name

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # This step ensures Unity's compressed .br or .gz files don't cause a decoding error in the browser
      - name: Create .htaccess/Fix Unity WebGL Compression
        run: |
          echo "Content-Encoding: gzip" > ./ultrakill/Build/.htaccess
          echo "Content-Encoding: br" >> ./ultrakill/Build/.htaccess
        continue-on-error: true

      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Targets ONLY the ultrakill folder as the website root directory
          path: './ultrakill'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
